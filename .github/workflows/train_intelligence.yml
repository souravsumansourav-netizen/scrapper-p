name: Train SKU Intelligence

on:
  workflow_dispatch:
    inputs:
      batch_id:
        description: 'Optional ETL batch identifier'
        required: false
        default: ''
        type: string

concurrency:
  group: train-intelligence
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Intelligence dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r intelligence/requirements-intel.txt
          pip install supabase>=2.0.0

      - name: Process pending R2 upload batches
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          if [ -n "${{ github.event.inputs.batch_id }}" ]; then
            python -m intelligence.process_batches --batch-id "${{ github.event.inputs.batch_id }}"
          else
            python -m intelligence.process_batches
          fi

      - name: Train models and push scores to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m intelligence.run_train --from-supabase --push-supabase
