name: Scrape SKUs

on:
  schedule:
    # Backup only. GitHub often starts schedules hours late; the on-time trigger is the
    # Supabase pg_cron job (migration 0021) that dispatches this workflow at 12:00 IST.
    - cron: '30 6 * * *' # 12:00 Noon IST daily (06:30 UTC)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Sync mode to run'
        required: true
        default: 'queued'
        type: choice
        options:
          - queued
          - daily
      use_browser:
        description: 'Install Playwright Chromium for JS-heavy sites'
        required: false
        default: true
        type: boolean

concurrency:
  group: scrape-skus
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # the worker stops starting new SKUs at 330 min
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium

      - name: Install Playwright system dependencies
        run: playwright install-deps chromium

      - name: Run Supabase sync worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python sync_supabase.py --mode=daily
          else
            python sync_supabase.py --mode=${{ inputs.mode }}
          fi

